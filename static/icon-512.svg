    <line x1="-30" y1="50" x2="-50" y2="100"/>
    <line x1="30" y1="50" x2="50" y2="100"/>
    <line x1="-50" y1="100" x2="50" y2="100"/>
    <line x1="-10" y1="50" x2="-10" y2="30"/>
    <line x1="10" y1="50" x2="10" y2="30"/>
  </g>
  <!-- Text -->
  <text x="256" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="72" font-weight="800" fill="url(#gold)">2026</text>
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#99aabb" letter-spacing="6">QUINIELA</text>
