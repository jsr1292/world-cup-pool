# Home Assistant add-on manifest for the World Cup Pool app.
# HA renders the configuration form from the `schema` below.
name: World Cup Pool
version: "1.0.113"
slug: world-cup-pool
description: >-
  Private FIFA World Cup 2026 prediction pool (SvelteKit + PostgreSQL/Neon).
  Set the database connection, admin bootstrap, and pool-creation policy in the
  configuration form below.
url: https://github.com/jsr1292/world-cup-pool
# Pi 5 is aarch64. amd64 added for free (the node base image is multi-arch).
arch:
  - aarch64
  - amd64
startup: application
# Manual boot so the add-on doesn't crash-loop before you've filled in the
# database_url. Switch to `auto` in the UI once it's configured and healthy.
boot: manual
# run.sh exec's node directly; no s6 service layer needed.
init: false

# ── Access ──────────────────────────────────────────────────────────────────
# Ingress: reachable from the HA sidebar with automatic HTTPS (HA terminates TLS).
ingress: true
ingress_port: 3000
panel_icon: mdi:soccer
panel_title: World Cup Pool
# Direct host port so it's also reachable on the LAN / behind your DuckDNS
# reverse proxy. Optional — ingress works without this mapping.
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: >-
    Direct / DuckDNS reverse-proxy access (optional). Ingress works without it.

# ── Configuration form ──────────────────────────────────────────────────────
# `options` are the defaults; `schema` drives validation and the form widgets.
options:
  database_url: ""
  node_env: production
  can_create_pools: admin
  admin_username: ""
  run_setup: false
  xff_depth: 1
  allowed_email_domain: ""
  public_base_url: ""
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_pass: ""
  smtp_from: ""
  api_football_key: ""
  auto_sync_minutes: 0
schema:
  # Neon (or any Postgres) connection string. Required. Provided at runtime —
  # never baked into the image.
  database_url: str
  # production enables Secure cookies + strict origin checks (needs HTTPS).
  node_env: list(development|production)
  # Who may create pools: admins only, or any registered user.
  can_create_pools: list(admin|anyone)
  # Optional: an EXISTING username to promote to admin on startup (idempotent).
  admin_username: str?
  # One-shot DB bootstrap: migrations + 48 teams + 104 fixtures. Idempotent, so
  # it's safe to leave on, but you can switch it back off after the first boot.
  run_setup: bool
  # Number of trusted reverse proxies in front of the app, used to pick the real
  # client IP from X-Forwarded-For (so login rate-limiting keys on the actual
  # client, not the proxy). Set to the count of proxies on YOUR access path:
  #   • HA ingress only ............................ 1
  #   • DuckDNS reverse proxy → add-on port 3000 ... 1
  #   • DuckDNS reverse proxy → HA ingress → app ... 2
  # Too low collapses all users into one rate-limit bucket; too high lets the
  # client spoof its IP. Default 1.
  xff_depth: int(1,5)
  # Restrict sign-ups to one email domain, e.g. "example.com" (no leading @).
  # Leave BLANK to allow any domain.
  allowed_email_domain: str?
  # Public HTTPS base URL used in password-reset email links, e.g.
  # "https://yourname.duckdns.org". Needed for self-service password reset to
  # produce clickable links. Leave blank to derive from the request (ingress).
  public_base_url: str?
  # ── SMTP (password-reset emails). Leave smtp_host blank to disable email; ──
  # ── users then recover passwords via an admin reset instead.              ──
  smtp_host: str?
  smtp_port: int(1,65535)?
  smtp_user: str?
  smtp_pass: password?
  # From header, e.g. "Mundial 2026 <no-reply@example.com>".
  smtp_from: str?
  # ── Hands-off live results (optional) ──────────────────────────────────────
  # API-Football key (api-sports.io). With this set, the app can import match
  # results automatically. Free tier (100 req/day) is plenty at sane intervals.
  api_football_key: password?
  # How often to auto-import results, in minutes. 0 = off (manual entry / manual
  # "Sincronizar ahora" only). Floored to 5 min to respect provider rate limits.
  # Suggested: 15–30 during the tournament.
  auto_sync_minutes: int(0,1440)
