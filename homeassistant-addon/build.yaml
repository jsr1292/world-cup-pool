# Base image per architecture for the Home Assistant builder.
# We use the official multi-arch Node 22 Alpine image (Node >= 22.12 satisfies
# Vite 8 / SvelteKit), and install bashio in the Dockerfile for option reads.
build_from:
  aarch64: node:22-alpine
  amd64: node:22-alpine
# Which revision of the app repository to build. Override here if you want to
# pin a tag/commit instead of tracking the default branch.
args:
  REPO_URL: "https://github.com/jsr1292/world-cup-pool"
  REPO_REF: "master"
labels:
  org.opencontainers.image.source: "https://github.com/jsr1292/world-cup-pool"
