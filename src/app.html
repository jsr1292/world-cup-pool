<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#07090f" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<title>Mundial 2026 · Quiniela</title>
		<link rel="manifest" href="/manifest.json" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
		<script>try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);if(t==='light'){document.querySelector('meta[name=theme-color]').content='#f5f5f0';document.body.style.background='#f5f5f0'}}}catch(e){}</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" style="background:#07090f">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
