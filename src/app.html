<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#07090f" />
		<meta name="format-detection" content="telephone=no,address=no,email=no,date=no" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Mundial 2026" />
		<link rel="apple-touch-icon" href="/icon-512.svg" />
		<title>Mundial 2026 · Quiniela</title>
		<link rel="manifest" href="/manifest.json" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />
		<script>try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);if(t==='light'){document.querySelector('meta[name=theme-color]').content='#f5f5f0';document.body.style.background='#f5f5f0'}}}catch(e){}</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash" style="position:fixed;inset:0;background:#07090f;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s;">
			<div style="text-align:center;">
				<div style="font-size:48px;margin-bottom:12px;">🏆</div>
				<div style="color:#c9a84c;font-size:24px;font-weight:700;font-family:'Libre Baskerville',Georgia,serif;">Mundial 2026</div>
				<div style="color:#888;font-size:12px;letter-spacing:0.15em;margin-top:8px;">QUINIELA</div>
			</div>
		</div>
		<script>
		if(sessionStorage.getItem('splash-shown')){var s=document.getElementById('splash');if(s)s.remove();}else{sessionStorage.setItem('splash-shown','1');setTimeout(function(){var s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(function(){s.remove();},500);}},800);}
		</script>
		<div id="svelte">%sveltekit.body%</div>
	</body>
</html>
